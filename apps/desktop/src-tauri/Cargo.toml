[package]
name = "mado-mata-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]
custom-protocol = ["desktop", "tauri/custom-protocol"]
webdriver = ["desktop", "dep:tauri-plugin-wdio-webdriver"]

[[bin]]
name = "mado-mata-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
mado-runtime-comparison = { path = "../../../tools/runtime-comparison" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
unicode-normalization = "=0.1.25"
zip = { version = "=8.6.0", default-features = false }
# Pinned streaming API bounds XML/binary plist expansion without a Value tree.
plist = { version = "=1.10.1", default-features = false, features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"] }
tauri = { version = "=2.11.6", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.4.0", optional = true }

tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", default-features = false, features = ["registry", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.4", features = ["exception"] }
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSDate", "NSDictionary", "NSEnumerator", "NSString", "NSURL"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "libc", "block2", "NSApplication", "NSRunningApplication", "NSOpenPanel", "NSPasteboard", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder", "NSView", "objc2-uniform-type-identifiers"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFBundle", "CFData", "CFDictionary", "CFNumber", "CFString", "CFURL"] }
objc2-security = { version = "=0.3.2", default-features = false, features = ["std", "CSCommon", "SecCode", "SecStaticCode", "SecRequirement"] }
objc2-uniform-type-identifiers = { version = "=0.3.2", default-features = false, features = ["std", "UTType", "UTCoreTypes"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[build-dependencies]
tauri-build = { version = "=2.6.3", optional = true }

[lints.rust]
# Audited native FFI uses local expectations; all other unsafe code is rejected.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
