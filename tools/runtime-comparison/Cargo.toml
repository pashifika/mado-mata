[package]
name = "mado-runtime-comparison"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[features]
default = []
engine = ["dep:mado-pilot"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "loader"] }
mlua = { version = "=0.12.1", default-features = false, features = ["lua54", "vendored", "serde"] }
mado-pilot = { git = "https://github.com/pashifika/mado-pilot", rev = "2c9d57a53e44ffc97315975c3ca46a766d6c8539", optional = true }

[build-dependencies]
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
