[package]
name = "mado-runtime-comparison"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[features]
default = []
engine = ["dep:mado-pilot", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
semver = "=1.0.28"
icu_locale_core = { version = "=2.3.0", default-features = false, features = ["alloc"] }
xid = { git = "https://github.com/pashifika/xid-rs", rev = "bb7de7a0370d051f7fc07f31b87db62549118bfe", default-features = false }
png = "=0.18.1"
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "loader"] }
mlua = { version = "=0.12.1", default-features = false, features = ["lua54", "vendored", "serde"] }
mado-pilot = { git = "https://github.com/pashifika/mado-pilot", rev = "db939f0905f0bff1a8185bef97e46d84b3571c80", optional = true }
mado-pilot-ocr = { git = "https://github.com/pashifika/mado-pilot", rev = "db939f0905f0bff1a8185bef97e46d84b3571c80" }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Performance", "Win32_System_Threading", "Win32_UI_HiDpi"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.4", features = ["exception"], optional = true }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "libc", "NSRunningApplication"], optional = true }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSDate", "NSString", "NSURL"], optional = true }

[build-dependencies]
sha2 = "=0.10.9"

[dev-dependencies]
mado-pilot-runtime = { git = "https://github.com/pashifika/mado-pilot", rev = "db939f0905f0bff1a8185bef97e46d84b3571c80" }
mado-pilot-capture = { git = "https://github.com/pashifika/mado-pilot", rev = "db939f0905f0bff1a8185bef97e46d84b3571c80" }
mado-pilot-core = { git = "https://github.com/pashifika/mado-pilot", rev = "db939f0905f0bff1a8185bef97e46d84b3571c80" }
mado-pilot-testkit = { git = "https://github.com/pashifika/mado-pilot", rev = "db939f0905f0bff1a8185bef97e46d84b3571c80" }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

# Keep resource-integrity checks fast in checkout builds.
[profile.dev.package.sha2]
opt-level = 3
