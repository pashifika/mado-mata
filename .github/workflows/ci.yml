name: CI

'on':
  pull_request:
    branches: [main, 'dev/**']
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main, 'dev/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-flow:
    name: Branch flow
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate event metadata
        run: python3 tools/ci/branch_flow.py

  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned Python dependency
        run: python3 -m pip install --require-hashes -r tools/ci/requirements.txt
      - name: Install checksum-verified native tools
        run: python3 tools/ci/install_tools.py
      - name: Check tracked repository files
        run: python3 tools/ci/check.py

  gate:
    name: ${{ github.event_name == 'pull_request' && 'CI Gate' || github.event_name == 'push' && 'CI Gate (push)' || 'CI Gate (manual)' }}
    if: ${{ always() }}
    needs: [branch-flow, repository]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every mandatory result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/ci/gate.py
