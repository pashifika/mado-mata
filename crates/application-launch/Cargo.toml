[package]
name = "mado-application-launch"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.4", features = ["exception"] }
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSError", "NSString", "NSURL"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSRunningApplication", "NSWorkspace"] }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
